name: Build Windows app

# Produces a ready-to-run Windows installer + portable exe so the app can be
# downloaded as a real .exe without building locally.
#
#  • Run manually from the Actions tab (workflow_dispatch)
#  • Or push a tag like v1.0.0
#
# The artifacts appear under the workflow run, and on tags also as a Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer (NSIS + portable)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SHOSO-Music-Windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

name: App screenshots

# Captures REAL screenshots of the running app (Playwright + Chromium) and
# commits the PNGs straight back to this branch so they can be assembled into
# a grid locally. Triggered on push to this feature branch.

on:
  push:
    branches: [arena/3c8f84f0-shoso]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (skip Electron postinstall)
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build:web

      - name: Install Playwright + Chromium
        run: |
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve built app + take screenshots
        run: |
          npx vite preview --host 0.0.0.0 --port 4173 &
          sleep 4
          node scripts/screenshots.mjs

      - name: Commit screenshots back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/i0534145445-bot/SHOSO.git
          git add screenshots/*.png 2>/dev/null || true
          git -c advice.dirtyExitCode=false commit -m "ci: add real app screenshots [skip ci]" || true
          git push origin HEAD:arena/3c8f84f0-shoso
